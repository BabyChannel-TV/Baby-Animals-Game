<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baby Animals">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js');}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Baby Animals — Balões</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;height:-webkit-fill-available;overflow:hidden;}
html{height:-webkit-fill-available;}
#wrap{width:100vw;height:100vh;height:-webkit-fill-available;position:relative;overflow:hidden;touch-action:none;}
canvas{position:absolute;inset:0;width:100%;height:100%;}
#hud{position:absolute;top:env(safe-area-inset-top, 44px);left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-top:10px;}
#total-badge{background:rgba(0,0,0,0.3);backdrop-filter:blur(6px);border-radius:20px;color:#fff;font-size:13px;font-family:Arial Rounded MT Bold,Arial,sans-serif;padding:4px 16px;}
#chars-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
.cbadge{background:rgba(0,0,0,0.22);backdrop-filter:blur(4px);border-radius:30px;color:#fff;font-size:12px;font-family:Arial Rounded MT Bold,Arial,sans-serif;padding:2px 8px;display:flex;align-items:center;gap:3px;}
.cicon{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:transparent;}
.cnum{font-size:13px;font-weight:900;}
#unlock-btn{position:absolute;top:calc(env(safe-area-inset-top, 44px) + 10px);right:16px;background:rgba(0,0,0,0.35);border:1.5px solid rgba(255,255,255,0.25);border-radius:20px;color:rgba(255,255,255,0.7);font-size:14px;padding:10px 20px;cursor:pointer;font-family:Arial,sans-serif;z-index:200;min-width:70px;min-height:44px;display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:manipulation;}
#music-btn{position:absolute;top:calc(env(safe-area-inset-top, 44px) + 10px);left:16px;background:rgba(0,0,0,0.35);border:1.5px solid rgba(255,255,255,0.25);border-radius:20px;color:rgba(255,255,255,0.85);font-size:20px;padding:8px 16px;cursor:pointer;font-family:Arial,sans-serif;z-index:200;min-width:56px;min-height:44px;display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:manipulation;}
#lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.68);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:14px;}
#lock-overlay h2{color:#fff;font-family:Arial Rounded MT Bold,Arial,sans-serif;font-size:22px;}
#lock-overlay p{color:rgba(255,255,255,0.6);font-size:13px;font-family:Arial,sans-serif;}
#pin-dots{display:flex;gap:12px;margin:4px 0;}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.5);background:transparent;transition:background .15s;}
.dot.filled{background:#fff;}
#numpad{display:grid;grid-template-columns:repeat(3,62px);gap:10px;}
.num-btn{width:62px;height:62px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.1);color:#fff;font-size:22px;font-family:Arial Rounded MT Bold,Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.num-btn:active{background:rgba(255,255,255,0.3);}
#pin-error{color:#FF6B6B;font-size:13px;font-family:Arial,sans-serif;height:16px;}
#goodbye{position:absolute;inset:0;background:linear-gradient(135deg,#FFD700,#FF8C00);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;gap:20px;}
#goodbye .bye-text{font-family:Arial Rounded MT Bold,Arial,sans-serif;font-size:52px;color:#fff;text-align:center;text-shadow:0 4px 12px rgba(0,0,0,0.3);line-height:1.2;}
#goodbye .bye-emoji{font-size:90px;animation:wave 0.8s ease-in-out infinite alternate;}
@keyframes wave{from{transform:rotate(-15deg);}to{transform:rotate(15deg);}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="total-badge">🌟 Baby Animals: 0</div>
    <div id="chars-row"></div>
  </div>
  <button id="unlock-btn">Sair</button>
  <button id="music-btn" aria-label="Música">🎵</button>
  <div id="lock-overlay">
    <h2>Codigo dos Pais</h2>
    <p>Digite o PIN para sair</p>
    <div id="pin-dots">
      <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    </div>
    <div id="pin-error"></div>
    <div id="numpad">
      <button class="num-btn" data-n="1">1</button>
      <button class="num-btn" data-n="2">2</button>
      <button class="num-btn" data-n="3">3</button>
      <button class="num-btn" data-n="4">4</button>
      <button class="num-btn" data-n="5">5</button>
      <button class="num-btn" data-n="6">6</button>
      <button class="num-btn" data-n="7">7</button>
      <button class="num-btn" data-n="8">8</button>
      <button class="num-btn" data-n="9">9</button>
      <button class="num-btn" data-n="del">&#x232B;</button>
      <button class="num-btn" data-n="0">0</button>
      <button class="num-btn" data-n="cancel">X</button>
    </div>
  </div>
</div>
  <div id="goodbye">
    <span class="bye-emoji">👋</span>
    <span class="bye-text">Até mais<br>AMIGUINHOS!</span>
  </div>

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('wrap');
let W,H,balloons=[],particles=[],score=0;
const POP_DURATION=1500;
const CHAR_NAMES=Object.keys(CHARS);
const counts={};
CHAR_NAMES.forEach(n=>counts[n]=0);

const loadedImgs={};
CHAR_NAMES.forEach(n=>{
  const img=new Image();img.src=CHARS[n].img;loadedImgs[n]=img;
});

const charsRow=document.getElementById('chars-row');
CHAR_NAMES.forEach(n=>{
  const d=document.createElement('div');d.className='cbadge';
  const ic=document.createElement('img');ic.className='cicon';
  ic.src=CHARS[n].img;
  const sp=document.createElement('span');sp.className='cnum';sp.id='ct-'+n;sp.textContent='0';
  d.appendChild(ic);d.appendChild(sp);charsRow.appendChild(d);
});

function resize(){W=wrap.clientWidth;H=wrap.clientHeight;canvas.width=W;canvas.height=H;}
resize();window.addEventListener('resize',resize);

const PALETTE=[
  {h:0,s:90,l:65},{h:45,s:95,l:60},{h:120,s:55,l:58},
  {h:200,s:80,l:62},{h:270,s:70,l:65},{h:330,s:75,l:65},
  {h:170,s:65,l:52},{h:25,s:90,l:62},
];
function makeBalloonColor(){
  const p=PALETTE[Math.floor(Math.random()*PALETTE.length)];
  return{fill:`hsla(${p.h},${p.s}%,${p.l}%,0.75)`,rim:`hsla(${p.h},${p.s}%,${p.l-15}%,0.45)`,particle:`hsl(${p.h},${p.s}%,${p.l}%)`};
}

function randBalloon(){
  const weights={Fred:10,Nina:10,Piky:10,Bob:10,Kevin:10,Robson:1};
  const pool=[];
  CHAR_NAMES.forEach(n=>{for(let i=0;i<weights[n];i++)pool.push(n);});
  const cn=pool[Math.floor(Math.random()*pool.length)];
  return{x:0,y:0,r:34+Math.random()*20,col:makeBalloonColor(),charName:cn,
    vx:(Math.random()-.5)*0.9,vy:-(1.3+Math.random()*1.3),
    wobble:Math.random()*Math.PI*2,wobbleSpeed:0.035+Math.random()*0.025,
    popped:false,popTime:0};
}
function spawnBalloon(){const b=randBalloon();b.x=b.r+Math.random()*(W-2*b.r);b.y=H+b.r+20;balloons.push(b);}

function spawnParticles(x,y,col){
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2,sp=2.5+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,col:col.particle,life:1,r:4+Math.random()*5,rot:Math.random()*Math.PI});
  }

function drawBg(){
  if(BG_IMG.complete&&BG_IMG.naturalWidth>0){
    // Cobrir toda a tela mantendo proporção (cover)
    const imgRatio=BG_IMG.naturalWidth/BG_IMG.naturalHeight;
    const canRatio=W/H;
    let sw,sh,sx,sy;
    if(canRatio>imgRatio){
      sw=BG_IMG.naturalWidth;
      sh=BG_IMG.naturalWidth/canRatio;
      sx=0;sy=(BG_IMG.naturalHeight-sh)/2;
    }else{
      sh=BG_IMG.naturalHeight;
      sw=BG_IMG.naturalHeight*canRatio;
      sx=(BG_IMG.naturalWidth-sw)/2;sy=0;
    }
    ctx.drawImage(BG_IMG,sx,sy,sw,sh,0,0,W,H);
  }else{
    // Fallback gradiente enquanto carrega
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#5BB8F5');g.addColorStop(1,'#D4EEFF');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
}

function drawBalloon(b,now){
  if(b.popped){
    const t=(now-b.popTime)/POP_DURATION;
    ctx.save();ctx.globalAlpha=(1-t)*(1-t);
    ctx.font=`${b.r*2*(1+t*0.8)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('💥',b.x,b.y);ctx.restore();return;
  }
  const wx=Math.sin(b.wobble)*3.5;
  const bx=b.x+wx,by=b.y,rx=b.r,ry=b.r*1.22;
  ctx.save();ctx.translate(bx,by);

  ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=14;ctx.shadowOffsetY=7;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=b.col.fill;ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.strokeStyle=b.col.rim;ctx.lineWidth=1.5;ctx.stroke();

  const img=loadedImgs[b.charName];
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();
    ctx.beginPath();ctx.ellipse(0,0,rx*0.92,ry*0.92,0,0,Math.PI*2);ctx.clip();
    const iw=img.naturalWidth,ih=img.naturalHeight;
    const zoom=b.charName==='Fred'?2.2:1.55;
    const scale=Math.max(rx*zoom/iw, ry*zoom/ih);
    const dw=iw*scale, dh=ih*scale;
    ctx.drawImage(img,-dw/2,-dh*0.52,dw,dh);
    ctx.restore();
  }

  const shineG=ctx.createRadialGradient(-rx*.28,-ry*.35,0,-rx*.1,-ry*.15,rx*.6);
  shineG.addColorStop(0,'rgba(255,255,255,0.5)');shineG.addColorStop(0.45,'rgba(255,255,255,0.1)');shineG.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.ellipse(-rx*.15,-ry*.2,rx*.4,ry*.32,-.4,0,Math.PI*2);ctx.fillStyle=shineG;ctx.fill();
  ctx.beginPath();ctx.ellipse(rx*.25,ry*.32,rx*.1,ry*.08,.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();

  ctx.beginPath();ctx.moveTo(-3,ry);ctx.quadraticCurveTo(-5,ry+7,0,ry+5);ctx.quadraticCurveTo(5,ry+7,3,ry);ctx.fillStyle=b.col.rim;ctx.fill();
  ctx.beginPath();ctx.moveTo(0,ry+5);for(let i=0;i<10;i++)ctx.lineTo((i%2===0?-3.5:3.5),ry+5+(i+1)*5);
  ctx.strokeStyle='rgba(80,60,40,0.22)';ctx.lineWidth=1.2;ctx.stroke();
  ctx.restore();
}

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  ctx.clearRect(0,0,W,H);drawBg();
  if(Math.random()<0.025&&balloons.filter(b=>!b.popped).length<14)spawnBalloon();
  balloons=balloons.filter(b=>b.popped?(now-b.popTime)<POP_DURATION:b.y>-200);
  balloons.forEach(b=>{
    if(!b.popped){b.x+=b.vx;b.y+=b.vy;b.wobble+=b.wobbleSpeed;if(b.x<b.r||b.x>W-b.r)b.vx*=-1;}
    drawBalloon(b,now);
  });
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.032;p.rot+=0.1;
    ctx.save();ctx.globalAlpha=p.life*p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.col;ctx.beginPath();ctx.roundRect(-p.r/2,-p.r/2,p.r,p.r,2);ctx.fill();ctx.restore();
  });
}

function updateHUD(){
  document.getElementById('total-badge').textContent='🌟 Baby Animals: '+score;
  CHAR_NAMES.forEach(n=>document.getElementById('ct-'+n).textContent=counts[n]);
}

function popBalloon(b){
  b.popped=true;b.popTime=performance.now();spawnParticles(b.x,b.y,b.col);
  score++;counts[b.charName]++;updateHUD();
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    if(b.charName==='Robson'){
      // Som do unicórnio — áudio fairy sparkle
      const a=ROBSON_SOUND.cloneNode();
      a.volume=1.0;
      a.play().catch(()=>{});
    } else {
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.setValueAtTime(700,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(180,ac.currentTime+0.18);
      g.gain.setValueAtTime(0.35,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.22);
      o.start();o.stop(ac.currentTime+0.22);
    }
  }catch(e){}
}

function hitTest(x,y){
  for(let i=balloons.length-1;i>=0;i--){
    const b=balloons[i];if(b.popped)continue;
    const dx=b.x-x,dy=b.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<b.r*1.15){popBalloon(b);return;}
  }
}

wrap.addEventListener('touchstart',e=>{
  if(document.getElementById('lock-overlay').style.display==='flex')return;
  if(e.target.closest('#unlock-btn')||e.target.closest('#music-btn'))return;
  e.preventDefault();const rect=wrap.getBoundingClientRect();
  Array.from(e.changedTouches).forEach(t=>hitTest(t.clientX-rect.left,t.clientY-rect.top));
},{passive:false});
wrap.addEventListener('click',e=>{
  if(document.getElementById('lock-overlay').style.display==='flex')return;
  if(e.target.closest('#music-btn'))return;
  const rect=wrap.getBoundingClientRect();hitTest(e.clientX-rect.left,e.clientY-rect.top);
});
wrap.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

const unlockBtn=document.getElementById('unlock-btn');
unlockBtn.addEventListener('touchstart',(e)=>{e.stopPropagation();},{passive:true});
unlockBtn.addEventListener('touchend',(e)=>{e.stopPropagation();e.preventDefault();document.getElementById('lock-overlay').style.display='flex';pinEntry='';updateDots();},{passive:false});
unlockBtn.addEventListener('click',()=>{

});

let pinEntry='';
function updateDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pinEntry.length);}
document.getElementById('numpad').addEventListener('click',e=>{
  const btn=e.target.closest('.num-btn');if(!btn)return;
  const n=btn.dataset.n;
  if(n==='cancel'){document.getElementById('lock-overlay').style.display='none';pinEntry='';updateDots();document.getElementById('pin-error').textContent='';return;}
  if(n==='del'){pinEntry=pinEntry.slice(0,-1);updateDots();return;}
  if(pinEntry.length>=4)return;
  pinEntry+=n;updateDots();
  if(pinEntry.length===4){
    if(pinEntry===PIN){
      document.getElementById('lock-overlay').style.display='none';
      document.getElementById('pin-error').textContent='';
      const gb=document.getElementById('goodbye');
      gb.style.display='flex';
      setTimeout(()=>{
        // Tenta abrir o YouTube app ou browser
        const ytUrl='https://www.youtube.com/@BabyChannel-TV';
        window.location.href='vnd.youtube://'+ytUrl.replace('https://','');
        setTimeout(()=>{ window.location.href=ytUrl; },800);
      },2000);
    }
    else{document.getElementById('pin-error').textContent='PIN incorreto';pinEntry='';setTimeout(()=>{updateDots();document.getElementById('pin-error').textContent='';document.getElementById('lock-overlay').style.display='none';},500);}
  }
});

/* ===== Música de fundo — canção de ninar (Web Audio, sem arquivos) ===== */
const musicBtn=document.getElementById('music-btn');
let musicOn=true,actx=null,masterGain=null,loopTimer=null;
const NOTE={C3:130.81,F3:174.61,G3:196.00,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25};
const BEAT=0.52;
const MELODY=[
 ['E4',1],['E4',1],['G4',2.5],[null,.5],
 ['E4',1],['E4',1],['G4',2.5],[null,.5],
 ['E4',1],['G4',1],['C5',1.5],['B4',.5],['A4',2],['A4',1],['G4',2],[null,1],
 ['D4',1],['E4',1],['F4',2],['D4',1],['D4',1],['E4',1],['F4',2],[null,1],
 ['D4',1],['F4',1],['B4',1],['A4',1],['G4',1],['B4',1],['C5',3],[null,1],
 ['C4',1],['C4',1],['C5',2],['A4',1],['F4',1],['G4',1],['E4',2],['C4',1],
 ['F4',1],['G4',1],['A4',1],['G4',1],['F4',1],['E4',1],['C4',3],[null,2]
];
const BASS_CYCLE=['C3','G3','F3','G3'];
function playTone(freq,t,dur,vol,type){
  const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type=type;o.frequency.value=freq;
  f.type='lowpass';f.frequency.value=1400;f.Q.value=0.5;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.06);
  g.gain.setTargetAtTime(vol*0.6,t+0.15,dur*0.4);
  g.gain.setTargetAtTime(0,t+dur*0.85,0.12);
  o.connect(f);f.connect(g);g.connect(masterGain);
  o.start(t);o.stop(t+dur+0.5);
}
function scheduleLoop(t0){
  let t=t0,totalBeats=0;
  MELODY.forEach(([n,b])=>{
    if(n)playTone(NOTE[n],t,b*BEAT,0.5,'triangle');
    t+=b*BEAT;totalBeats+=b;
  });
  let bt=t0,i=0;
  while(bt<t0+totalBeats*BEAT-0.1){
    playTone(NOTE[BASS_CYCLE[i%BASS_CYCLE.length]],bt,4*BEAT,0.16,'sine');
    bt+=4*BEAT;i++;
  }
  const loopDur=totalBeats*BEAT;
  loopTimer=setTimeout(()=>scheduleLoop(t0+loopDur),Math.max(200,(t0+loopDur-actx.currentTime-1)*1000));
}
function initMusic(){
  if(actx)return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=actx.createGain();
  masterGain.gain.value=0.04; /* volume bem baixo — só da música */
  masterGain.connect(actx.destination);
  actx.resume().then(()=>{ scheduleLoop(actx.currentTime+0.2); if(!musicOn)actx.suspend(); });
}
document.addEventListener('pointerdown',initMusic,{capture:true});
document.addEventListener('touchstart',initMusic,{capture:true,passive:true});
function toggleMusic(){
  musicOn=!musicOn;
  musicBtn.textContent=musicOn?'🎵':'🔇';
  if(!actx){if(musicOn)initMusic();return;}
  if(musicOn)actx.resume();else actx.suspend();
}
musicBtn.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:true});
musicBtn.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();toggleMusic();},{passive:false});
musicBtn.addEventListener('click',e=>{e.stopPropagation();toggleMusic();});

loop();
for(let i=0;i<6;i++)setTimeout(spawnBalloon,i*260);
